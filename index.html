<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>মনৰ কথা | Tinsukia College</title>
  <style>
    /* Clean, Simple & Direct Styling */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      color: #333;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      max-width: 800px;
      background: #ffffff;
      padding: 15px 20px;
      border: 1px solid #ddd;
      border-radius: 8px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .portal-title {
      font-size: 1.4rem;
      font-weight: bold;
      color: #d97706;
    }

    .user-status {
      font-size: 0.9rem;
      font-weight: bold;
      color: #059669;
    }

    .container {
      width: 100%;
      max-width: 800px;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      background: #e5e7eb;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .tab-btn.active {
      background: #d97706;
      color: #ffffff;
      border-color: #d97706;
    }

    .card {
      background: #ffffff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 25px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .hidden {
      display: none !important;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      font-size: 0.9rem;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 1rem;
    }

    button.btn-action {
      width: 100%;
      padding: 12px;
      background: #d97706;
      color: white;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
    }

    button.btn-action:hover {
      background: #b45309;
    }

    .notice-box {
      background: #fef3c7;
      border-left: 4px solid #d97706;
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 4px;
    }

    .feed-item {
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    @media screen and (max-width: 600px) {
      .tabs {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="portal-title">মনৰ কথা | Tinsukia College</div>
    <div id="userStatus" class="user-status">Not Logged In</div>
  </header>

  <div class="container">

    <!-- NAVIGATION TABS -->
    <div class="tabs">
      <button id="btn-auth" class="tab-btn active" onclick="switchTab('auth')">1. Register / Login</button>
      <button id="btn-submit" class="tab-btn" onclick="switchTab('submit')">2. Submit Grievance</button>
      <button id="btn-feed" class="tab-btn" onclick="switchTab('feed')">Announcements & Feed</button>
      <button id="btn-about" class="tab-btn" onclick="switchTab('about')">About Admin</button>
    </div>

    <!-- TAB 1: AUTHENTICATION (DEFAULT HOME PAGE) -->
    <div id="tab-auth" class="card">
      <h2 style="margin-bottom: 15px;">Student Login</h2>
      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Email or Phone Number</label>
          <input type="text" id="loginEmail" required placeholder="Enter registered email or phone">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPass" required placeholder="Enter password">
        </div>
        <button type="submit" class="btn-action">Login</button>
      </form>

      <hr style="margin: 25px 0; border: 0; border-top: 1px solid #ccc;">

      <h2 style="margin-bottom: 15px;">New Student Registration</h2>
      <form onsubmit="handleRegister(event)">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="regName" required placeholder="e.g., Deep Hazarika">
        </div>
        <div class="form-group">
          <label>Class / Semester</label>
          <input type="text" id="regClass" required placeholder="e.g., BSc 4th Sem">
        </div>
        <div class="form-group">
          <label>Email or Phone</label>
          <input type="text" id="regEmail" required placeholder="Enter email or phone">
        </div>
        <div class="form-group">
          <label>Set Password</label>
          <input type="password" id="regPass" required placeholder="Create password">
        </div>
        <button type="submit" class="btn-action" style="background: #4b5563;">Register Account</button>
      </form>
    </div>

    <!-- TAB 2: SUBMIT MESSAGE (LOCKED UNTIL LOGIN) -->
    <div id="tab-submit" class="card hidden">
      <h2 style="margin-bottom: 15px;">Submit Your Grievance / Feedback</h2>
      <form onsubmit="handleMessageSubmit(event)">
        <div class="form-group">
          <label>Category</label>
          <select id="msgType" required>
            <option value="Formal Grievance">Formal Grievance</option>
            <option value="Complaint">Complaint</option>
            <option value="Idea">Idea</option>
          </select>
        </div>
        <div class="form-group">
          <label>Your Message (মনৰ কথা)</label>
          <textarea id="userMsg" rows="5" required placeholder="Write your details clearly..."></textarea>
        </div>
        <button type="submit" id="submitBtn" class="btn-action">Send Submission</button>
      </form>
    </div>

    <!-- TAB 3: FEED & ANNOUNCEMENTS -->
    <div id="tab-feed" class="card hidden">
      <h2 style="margin-bottom: 15px;">Official Announcements</h2>
      <div id="announcementsArea"></div>

      <h2 style="margin: 20px 0 15px 0;">Public Approved Feed</h2>
      <div id="feedList"><p>Loading messages...</p></div>
    </div>

    <!-- TAB 4: ABOUT ADMIN -->
    <div id="tab-about" class="card hidden">
      <h2 id="adminName">Deep Hazarika</h2>
      <p id="adminRole" style="color: #d97706; font-weight: bold; margin-bottom: 10px;">Social Service Secretary</p>
      <p id="adminBio" style="margin-bottom: 15px; color: #555;"></p>
      <p><strong>Email:</strong> <span id="adminEmail"></span></p>
      <p style="margin-top: 5px;"><strong>Phone:</strong> <span id="adminPhone"></span></p>
    </div>

  </div>

  <script>
    // ⚠️ REPLACE THIS WITH YOUR EXACT APPS SCRIPT WEB APP URL
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby3BETPx8pXiHMy_BDgmxwdEPSDWP4lDzIDyVEZTJdCEk179u8gbDI2vlqCibzxt3Ly/exec";

    let currentUser = null;

    // FORCE TAB SWITCHING RULES
    function switchTab(tabName) {
      if (tabName === 'submit' && !currentUser) {
        alert("Access Denied: Please Login or Register first!");
        tabName = 'auth';
      }

      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.card').forEach(card => card.classList.add('hidden'));

      if (tabName === 'auth') {
        document.getElementById('btn-auth').classList.add('active');
        document.getElementById('tab-auth').classList.remove('hidden');
      } else if (tabName === 'submit') {
        document.getElementById('btn-submit').classList.add('active');
        document.getElementById('tab-submit').classList.remove('hidden');
      } else if (tabName === 'feed') {
        document.getElementById('btn-feed').classList.add('active');
        document.getElementById('tab-feed').classList.remove('hidden');
        loadPortalData();
      } else if (tabName === 'about') {
        document.getElementById('btn-about').classList.add('active');
        document.getElementById('tab-about').classList.remove('hidden');
        loadPortalData();
      }
    }

    // USER REGISTRATION
    async function handleRegister(e) {
      e.preventDefault();
      const payload = {
        action: "register",
        name: document.getElementById('regName').value,
        classVal: document.getElementById('regClass').value,
        emailOrPhone: document.getElementById('regEmail').value,
        password: document.getElementById('regPass').value
      };

      try {
        await fetch(GOOGLE_SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });
        alert("Registration Successful! Now enter your credentials in the Login form above.");
      } catch (err) {
        alert("Registration failed. Try again.");
      }
    }

    // USER LOGIN
    async function handleLogin(e) {
      e.preventDefault();
      const payload = {
        action: "login",
        emailOrPhone: document.getElementById('loginEmail').value,
        password: document.getElementById('loginPass').value
      };

      try {
        const res = await fetch(GOOGLE_SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (data.status === "success") {
          currentUser = data.user;
          document.getElementById('userStatus').innerText = `Logged in as: ${currentUser.Name}`;
          alert(`Welcome ${currentUser.Name}! Opening Grievance form...`);
          switchTab('submit');
        } else {
          alert("Invalid Login Credentials!");
        }
      } catch (err) {
        alert("Login request failed.");
      }
    }

    // SUBMIT GRIEVANCE
    async function handleMessageSubmit(e) {
      e.preventDefault();
      if (!currentUser) {
        alert("You must log in first!");
        switchTab('auth');
        return;
      }

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.innerText = "Sending...";
      submitBtn.disabled = true;

      const payload = {
        action: "submit_msg",
        authorName: currentUser.Name,
        authorClass: currentUser.Class,
        category: document.getElementById('msgType').value,
        content: document.getElementById('userMsg').value
      };

      try {
        await fetch(GOOGLE_SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });
        alert("Grievance submitted successfully!");
        document.getElementById('userMsg').value = "";
      } catch (err) {
        alert("Error sending grievance.");
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "Send Submission";
      }
    }

    // FETCH DATA
    async function loadPortalData() {
      try {
        const res = await fetch(`${GOOGLE_SCRIPT_URL}?action=get_portal_data`);
        const data = await res.json();

        const feedList = document.getElementById('feedList');
        if (data.submissions && data.submissions.length > 0) {
          feedList.innerHTML = "";
          data.submissions.forEach(item => {
            feedList.innerHTML += `
              <div class="feed-item">
                <strong>${item.AuthorName} (${item.AuthorClass})</strong> - <span style="color:#d97706;">[${item.Category}]</span>
                <p style="margin-top: 5px;">${item.Content}</p>
              </div>`;
          });
        } else {
          feedList.innerHTML = "<p>No approved messages yet.</p>";
        }

        const annArea = document.getElementById('announcementsArea');
        if (data.announcements && data.announcements.length > 0) {
          annArea.innerHTML = "";
          data.announcements.forEach(ann => {
            annArea.innerHTML += `
              <div class="notice-box">
                <strong>${ann.Title}</strong>
                <p style="margin-top: 5px;">${ann.Message}</p>
              </div>`;
          });
        }

        if (data.admin) {
          document.getElementById('adminName').innerText = data.admin.Name || "Deep Hazarika";
          document.getElementById('adminRole').innerText = data.admin.Role || "Social Service Secretary";
          document.getElementById('adminBio').innerText = data.admin.Bio || "";
          document.getElementById('adminEmail').innerText = data.admin.Email || "";
          document.getElementById('adminPhone').innerText = data.admin.Phone || "";
        }
      } catch (err) {
        console.error(err);
      }
    }
  </script>
</body>
</html>
