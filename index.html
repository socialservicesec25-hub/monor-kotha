 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>মনৰ কথা | Tinsukia College Student Portal</title>
  <style>
    :root {
      --primary: #d97706;
      --primary-hover: #b45309;
      --bg-dark: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    header {
      width: 100%;
      max-width: 800px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 30px;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-container img {
      width: 45px;
      height: 45px;
      border-radius: 50%;
    }

    .portal-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--primary);
    }

    .container {
      width: 100%;
      max-width: 800px;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    h2 {
      margin-bottom: 16px;
      font-size: 1.2rem;
      color: var(--primary);
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.9rem;
      color: var(--text-sub);
    }

    input, select, textarea {
      width: 100%;
      padding: 10px 14px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
    }

    button {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: var(--primary-hover);
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text-sub);
    }

    .tab-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .hidden {
      display: none;
    }

    .feed-item {
      padding: 14px;
      border-bottom: 1px solid var(--border);
    }

    .feed-item:last-child {
      border-bottom: none;
    }

    .feed-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-bottom: 6px;
    }

    .feed-body {
      font-size: 0.95rem;
      line-height: 1.4;
    }

    .status-badge {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 12px;
      background: rgba(217, 119, 6, 0.2);
      color: var(--primary);
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-container">
      <img src="college-logo.png" alt="Tinsukia College Logo">
      <div class="portal-title">মনৰ কথা | Tinsukia College</div>
    </div>
    <div id="userInfo" class="status-badge hidden">Logged In</div>
  </header>

  <div class="container">

    <!-- NAVIGATION TABS -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('submit')">Submit Message</button>
      <button class="tab-btn" onclick="switchTab('feed')">Announcements & Feed</button>
      <button class="tab-btn" onclick="switchTab('auth')">Register / Login</button>
    </div>

    <!-- TAB 1: SUBMISSION FORM -->
    <div id="tab-submit" class="card">
      <h2>Submit Your Request / Feedback</h2>
      <form id="msgForm" onsubmit="handleMessageSubmit(event)">
        <div class="form-group">
          <label for="msgType">Category</label>
          <select id="msgType" required>
            <option value="Formal Grievance">Formal Grievance</option>
            <option value="Complaint">Complaint</option>
            <option value="Idea">Idea</option>
          </select>
        </div>

        <div class="form-group">
          <label for="userMsg">Your Message (মনৰ কথা)</label>
          <textarea id="userMsg" rows="4" placeholder="Write your message here..." required></textarea>
        </div>

        <button type="submit" id="submitBtn">Send Submission</button>
      </form>
    </div>

    <!-- TAB 2: PUBLIC FEED & ANNOUNCEMENTS -->
    <div id="tab-feed" class="card hidden">
      <h2>Announcements & Public Messages</h2>
      <div id="feedList">
        <p style="color: var(--text-sub);">Loading data from Google Sheets...</p>
      </div>
    </div>

    <!-- TAB 3: AUTHENTICATION -->
    <div id="tab-auth" class="card hidden">
      <h2>Student Registration</h2>
      <form id="regForm" onsubmit="handleRegister(event)" style="margin-bottom: 24px;">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="regName" required>
        </div>
        <div class="form-group">
          <label>Class / Semester</label>
          <input type="text" id="regClass" placeholder="e.g., BSC 4TH" required>
        </div>
        <div class="form-group">
          <label>Email or Phone</label>
          <input type="text" id="regEmail" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="regPass" required>
        </div>
        <button type="submit">Register Account</button>
      </form>

      <h2>Login</h2>
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Email / Phone</label>
          <input type="text" id="loginEmail" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPass" required>
        </div>
        <button type="submit">Login</button>
      </form>
    </div>

  </div>

  <script>
    // ⚠️ REPLACE THIS WITH YOUR DEPLOYED GOOGLE APPS SCRIPT WEB APP URL
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz-6_r5c0OFnpIbb1iBq4nk1fURpVct6yFp0VrpBzD5pUx2UZgoLZG1ndH5213HrXQD/exec";

    let currentUser = null;

    // SWITCH TAB NAVIGATION
    function switchTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.card').forEach(card => card.classList.add('hidden'));

      if (tabName === 'submit') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('tab-submit').classList.remove('hidden');
      } else if (tabName === 'feed') {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('tab-feed').classList.remove('hidden');
        loadPortalData();
      } else if (tabName === 'auth') {
        document.querySelectorAll('.tab-btn')[2].classList.add('active');
        document.getElementById('tab-auth').classList.remove('hidden');
      }
    }

    // SUBMIT MESSAGE / GRIEVANCE
    async function handleMessageSubmit(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = "Sending...";

      const payload = {
        action: "submit_msg",
        authorName: currentUser ? currentUser.Name : "Anonymous Student",
        authorClass: currentUser ? currentUser.Class : "N/A",
        category: document.getElementById('msgType').value,
        content: document.getElementById('userMsg').value
      };

      try {
        const response = await fetch(GOOGLE_SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });
        
        alert("Message submitted successfully! It is currently pending review.");
        document.getElementById('msgForm').reset();
      } catch (err) {
        console.error(err);
        alert("Error sending message.");
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "Send Submission";
      }
    }

    // REGISTER ACCOUNT
    async function handleRegister(e) {
      e.preventDefault();
      const payload = {
        action: "register",
        name: document.getElementById('regName').value,
        classVal: document.getElementById('regClass').value,
        emailOrPhone: document.getElementById('regEmail').value,
        password: document.getElementById('regPass').value
      };

      try {
        await fetch(GOOGLE_SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });
        alert("Registration successful! You can now log in.");
        document.getElementById('regForm').reset();
      } catch (err) {
        alert("Registration failed.");
      }
    }

    // LOGIN USER
    async function handleLogin(e) {
      e.preventDefault();
      const payload = {
        action: "login",
        emailOrPhone: document.getElementById('loginEmail').value,
        password: document.getElementById('loginPass').value
      };

      try {
        const res = await fetch(GOOGLE_SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (data.status === "success") {
          currentUser = data.user;
          document.getElementById('userInfo').innerText = `Logged in: ${currentUser.Name}`;
          document.getElementById('userInfo').classList.remove('hidden');
          alert("Login successful!");
          switchTab('submit');
        } else {
          alert("Invalid credentials.");
        }
      } catch (err) {
        alert("Login failed.");
      }
    }

    // FETCH FEED & ANNOUNCEMENTS FROM GOOGLE SHEETS
    async function loadPortalData() {
      const feedList = document.getElementById('feedList');
      feedList.innerHTML = "<p style='color: var(--text-sub);'>Loading data from Google Sheets...</p>";

      try {
        const res = await fetch(`${GOOGLE_SCRIPT_URL}?action=get_portal_data`);
        const data = await res.json();

        if (data && data.submissions) {
          feedList.innerHTML = "";
          data.submissions.forEach(item => {
            const div = document.createElement('div');
            div.className = 'feed-item';
            div.innerHTML = `
              <div class="feed-header">
                <span><strong>${item.AuthorName}</strong> (${item.AuthorClass})</span>
                <span class="status-badge">${item.Status || 'Pending'}</span>
              </div>
              <div class="feed-body">${item.Content}</div>
            `;
            feedList.appendChild(div);
          });
        } else {
          feedList.innerHTML = "<p>No messages available yet.</p>";
        }
      } catch (err) {
        console.error(err);
        feedList.innerHTML = "<p style='color: #ef4444;'>Failed to load feed data from Google Sheets.</p>";
      }
    }
  </script>
</body>
</html>
